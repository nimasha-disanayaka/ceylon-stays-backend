name: Backend CI & Automated Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: booking_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Prisma Migrations
        env:
          DATABASE_URL: postgresql://postgres:password123@localhost:5432/booking_platform_test?schema=public
        run: npx prisma migrate deploy

      - name: Seed Test Database
        env:
          DATABASE_URL: postgresql://postgres:password123@localhost:5432/booking_platform_test?schema=public
        run: npm run seed

      - name: Run Integration Tests
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:password123@localhost:5432/booking_platform_test?schema=public
          JWT_SECRET: test_jwt_secret_key
        run: npm test
