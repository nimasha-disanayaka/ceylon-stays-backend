version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ceylon_stays_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CeylonStaysSecure2026!}
      POSTGRES_DB: ${POSTGRES_DB:-booking_platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ceylon_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: ceylon_stays_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-CeylonStaysSecure2026!}@postgres:5432/${POSTGRES_DB:-booking_platform}?schema=public
      JWT_SECRET: ${JWT_SECRET:-ceylon_stays_super_jwt_secret_production_2026}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - ceylon_net

  web:
    build:
      context: ../../booking-platform-web
      dockerfile: Dockerfile
    container_name: ceylon_stays_web
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    depends_on:
      - backend
    networks:
      - ceylon_net

  nginx:
    image: nginx:alpine
    container_name: ceylon_stays_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - web
    networks:
      - ceylon_net

volumes:
  postgres_data:
  backend_uploads:

networks:
  ceylon_net:
    driver: bridge
